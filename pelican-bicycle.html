<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f1e7">
  <title>鹈鹕的海岸骑行 · Pelican Pedal Club</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');

    :root { color-scheme: light; --ink: #243f3b; --paper: #f5f1e7; --muted: #75857b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'DM Sans', 'PingFang SC', sans-serif; }
    .page { max-width: 1440px; min-height: 100svh; margin: auto; padding: 32px 6vw 24px; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid #243f3b24; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    .brand svg { width: 35px; height: 35px; }
    .edition { font-size: 10px; letter-spacing: .17em; color: var(--muted); }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .intro { position: relative; text-align: center; margin: 38px 0 4px; }
    .eyebrow { margin: 0 0 14px; font-size: 10px; letter-spacing: .26em; font-weight: 600; color: #718379; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(40px, 5.6vw, 74px); font-weight: 500; letter-spacing: -.045em; line-height: 1.12; margin: 0; }
    h1 em { color: #c56d48; font-weight: 500; }
    .subtitle { margin: 17px 0 0; font-size: 12px; letter-spacing: .16em; color: #7a877c; }
    .illustration { position: relative; width: 100%; max-width: 1040px; margin: 6px auto 0; }
    .scene { display: block; width: 100%; height: auto; overflow: visible; }
    .caption { display: flex; justify-content: space-between; gap: 18px; align-items: center; width: 100%; max-width: 920px; margin: -2px auto 27px; }
    .location { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: .11em; color: #7a877c; }
    .location svg { width: 14px; height: 14px; }
    button { display: flex; align-items: center; justify-content: center; gap: 9px; padding: 10px 17px; border: 1px solid #243f3b40; border-radius: 100px; background: transparent; color: var(--ink); font: inherit; font-size: 11px; cursor: pointer; transition: background .2s, transform .2s; }
    button:hover { background: #e6e8dc; transform: translateY(-1px); }
    button:focus-visible { outline: 2px solid #c56d48; outline-offset: 4px; }
    button svg { width: 13px; height: 13px; }
    footer { padding-top: 18px; border-top: 1px solid #243f3b24; display: flex; justify-content: space-between; align-items: center; gap: 24px; font-size: 10px; color: #7a877c; letter-spacing: .08em; }
    .footer-note { font-family: Georgia, serif; font-style: italic; font-size: 14px; letter-spacing: 0; }
    .live { display: inline-flex; align-items: center; gap: 7px; }
    .live::before { content: ''; height: 5px; width: 5px; background: #7c987b; border-radius: 50%; }

    .wheel-spokes { animation: spin 1.3s linear infinite; }
    .rear-spokes { transform-origin: 345px 398px; }
    .front-spokes { transform-origin: 677px 398px; }
    .crank { transform-origin: 485px 398px; animation: spin 1.3s linear infinite; }
    .rider { animation: bob 1.3s ease-in-out infinite; }
    .scarf-tail { transform-origin: 493px 210px; animation: flutter .65s ease-in-out infinite alternate; }
    .feather { transform-origin: 476px 165px; animation: flutter .7s ease-in-out infinite alternate; }
    .cloud-one { animation: cloud-drift 20s ease-in-out infinite alternate; }
    .cloud-two { animation: cloud-drift 26s ease-in-out infinite alternate-reverse; }
    .road-track { animation: road 1.3s linear infinite; }
    .passing-grass { animation: grass-drift 5.2s linear infinite; }
    .bird { animation: bird-drift 9s ease-in-out infinite alternate; }
    .wind { animation: wind 2.6s ease-in-out infinite; }
    .wind-late { animation-delay: -1.3s; }
    .paused *, .paused *::before { animation-play-state: paused !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 50%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(2px); } }
    @keyframes flutter { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
    @keyframes cloud-drift { from { transform: translateX(-16px); } to { transform: translateX(25px); } }
    @keyframes road { to { transform: translateX(-160px); } }
    @keyframes grass-drift { from { transform: translateX(1000px); } to { transform: translateX(-170px); } }
    @keyframes bird-drift { from { transform: translate(0, 0); } to { transform: translate(-35px, -9px); } }
    @keyframes wind { 0%, 100% { opacity: 0; transform: translateX(12px); } 35%, 65% { opacity: .7; } 80% { transform: translateX(-20px); opacity: 0; } }
    @media (max-width: 600px) {
      .page { padding: 23px 5vw; }
      .edition { font-size: 8px; letter-spacing: .09em; }
      .brand { font-size: 9px; gap: 7px; }
      .intro { margin-top: 43px; }
      .subtitle { font-size: 10px; letter-spacing: .1em; }
      .illustration { width: 112%; margin-left: -6%; margin-top: 26px; }
      .caption { margin-top: 24px; }
      .location { font-size: 8px; letter-spacing: .04em; }
      footer { font-size: 8px; }
      .footer-note { font-size: 12px; }
      .live { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="18.5" stroke="currentColor"/>
          <path d="M10 26c9 3 16-1 14-8-1-4-6-5-7-1-1 3 2 4 5 3M23 17h10l-9 4M13 25l-3-6 8 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

        <span>PELICAN PEDAL CLUB</span>
      </div>
      <div class="edition">LITTLE JOURNEYS / NO. 001</div>
    </header>

    <main>
      <div class="intro">
        <p class="eyebrow">A LITTLE WIND. A LITTLE WONDER.</p>
        <h1>Life is better <em>on two wheels.</em></h1>

            <path d="M345 398 426 294 485 398Z M426 294 620 294 485 398M620 294l57 104" stroke="#315d50" stroke-width="10"/>

            <path d="M642 234q23 29-12 67" stroke="#61796c" stroke-width="1.7"/>
            <path d="M345 391 484 381q21 3 21 17t-21 18l-139-10q-12-5 0-15Z" stroke="#596b56" stroke-width="2"/>
          </g>
          <path d="M392 256q-4-8 7-9l44 3q14 2 9 10c-3 5-17 5-30 3Z" fill="#835c43" stroke="#314a43" stroke-width="2.5"/>
          <g fill="#c8cdb5" stroke="#38584a" stroke-width="3">
            <circle cx="345" cy="398" r="6"/>
            <circle cx="677" cy="398" r="6"/>
            <circle cx="485" cy="398" r="19"/>
          </g>
          <g class="crank" fill="none" stroke="#314a43" stroke-width="5" stroke-linecap="round"><path d="M456 398h58"/></g>

            <path d="M546 166q17 22 31 22" fill="none" stroke="#f6d394" stroke-width="3"/>
            <ellipse cx="523" cy="137" rx="7.5" ry="8" fill="#f3d99a" stroke="none"/>
            <circle cx="525" cy="137" r="3.5" fill="#293e37" stroke="none"/>

      <div class="caption">
        <div class="location">

        <button id="toggle" type="button" aria-label="暂停动画">

    <footer>
      <span>A SMALL ESCAPE, ON REPEAT.</span>
      <span class="footer-note">Enjoy the ride.</span>
      <span class="live">海风正好 · 心情晴朗</span>
    </footer>
  </div>

  <script>
    // Both feet follow opposite ends of the same crank; knees bend to meet them.
    const scene = document.getElementById('scene');
    const toggle = document.getElementById('toggle');
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    const parts = Object.fromEntries([
      'near-leg', 'near-leg-highlight', 'near-foot', 'near-pedal',
      'far-leg', 'far-foot', 'far-pedal'
    ].map(id => [id, document.getElementById(id)]));
    let paused = motionPreference.matches;
    let elapsed = 0;
    let previousTime = null;
    let animationFrame = null;

    function drawLeg(side, angle) {
      const x = 485 + Math.cos(angle) * 29;
      const y = 398 + Math.sin(angle) * 29;
      const near = side === 'near';
      const hipX = near ? 445 : 451;
      const hipY = near ? 288 : 297;
      const dx = x - hipX;
      const dy = y - hipY;
      const distance = Math.hypot(dx, dy);
      const upper = 72;
      const lower = 72;
      const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
      const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
      const kneeX = hipX + dx * along / distance - dy * bend / distance;
      const kneeY = hipY + dy * along / distance + dx * bend / distance;
      const leg = `M${hipX} ${hipY}L${kneeX} ${kneeY}L${x} ${y}`;
      parts[`${side}-leg`].setAttribute('d', leg);
      if (near) parts['near-leg-highlight'].setAttribute('d', leg);
      parts[`${side}-foot`].setAttribute('d', `M${x - 5} ${y - 4}q12-5 23 5l-30 1Z`);
      parts[`${side}-pedal`].setAttribute('d', `M${x - 12} ${y + 3}h25`);
    }

    function draw() {
      const angle = elapsed / 1300 * Math.PI * 2;
      drawLeg('near', angle + Math.PI);
      drawLeg('far', angle);
    }

    function tick(time) {
      if (paused) { animationFrame = null; return; }
      if (previousTime !== null) elapsed += time - previousTime;
      previousTime = time;
      draw();
      animationFrame = requestAnimationFrame(tick);
    }

    function updatePlayback() {
      scene.classList.toggle('paused', paused);
      document.getElementById('toggle-label').textContent = paused ? '继续兜风' : '歇一会儿';
      document.getElementById('pause-icon').style.display = paused ? 'none' : '';
      document.getElementById('play-icon').style.display = paused ? '' : 'none';
      toggle.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
      if (animationFrame !== null) cancelAnimationFrame(animationFrame);
      previousTime = null;
      animationFrame = paused ? null : requestAnimationFrame(tick);
    }

    toggle.addEventListener('click', () => { paused = !paused; updatePlayback(); });
    motionPreference.addEventListener('change', event => { paused = event.matches; updatePlayback(); });
    document.addEventListener('visibilitychange', () => { previousTime = null; });
    draw();
    updatePlayback();
  </script>
</body>
</html>
