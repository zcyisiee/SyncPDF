<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ieeTranslater · 学术 PDF 翻译工作台</title>
<style>
/* ============================================================
   1. 设计令牌 — 绑定 editorial-monocle 方向（暖纸 / 墨 / 单一强调色）
   派生色一律用 oklch()，不引入新的十六进制
   ============================================================ */
:root{
  --bg:            oklch(97.6% 0.006 92);
  --canvas:        oklch(94.6% 0.008 90);
  --surface:       oklch(99.5% 0.003 95);
  --surface-2:     oklch(97.9% 0.005 92);
  --surface-3:     oklch(96.2% 0.007 90);
  --paper:         oklch(99.8% 0.002 95);
  --fg:            oklch(22% 0.016 70);
  --fg-strong:     oklch(15% 0.018 70);
  --muted:         oklch(48% 0.012 70);
  --muted-2:       oklch(58% 0.010 72);
  --border:        oklch(90% 0.006 95);
  --border-strong: oklch(83% 0.008 92);
  --row-line:      oklch(93.4% 0.006 94);
  --accent:        oklch(52% 0.10 28);
  --accent-strong: oklch(44% 0.105 28);
  --accent-hover:  oklch(38% 0.105 28);
  --accent-soft:   oklch(95.6% 0.014 32);
  --accent-line:   oklch(86% 0.032 30);
  --ok:            oklch(46% 0.085 155);
  --ok-soft:       oklch(95.2% 0.021 155);
  --run:           oklch(48% 0.082 245);
  --run-soft:      oklch(95.4% 0.018 245);
  --warn:          oklch(52% 0.10 72);
  --warn-soft:     oklch(95.8% 0.028 80);
  --danger:        oklch(45% 0.14 25);
  --danger-soft:   oklch(95.4% 0.026 25);
  --font-display:'Iowan Old Style','Charter','Songti SC','Noto Serif SC',Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Segoe UI',system-ui,sans-serif;
  --font-mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --r:4px; --r-sm:3px;
  --nav-w:280px; --insp-w:340px; --gut:6px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:400 13px/1.5 var(--font-body);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px}
.ic{display:block;flex:none}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:400 10.5px/1 var(--font-mono);letter-spacing:.09em;color:var(--muted-2);text-transform:uppercase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border:2px solid transparent;background-clip:content-box;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   2. 三栏骨架
   ============================================================ */
.app{position:relative;height:100vh;overflow:hidden;display:grid;
  grid-template-columns:var(--nav-w) var(--nav-gut,var(--gut)) minmax(0,1fr) var(--insp-gut,var(--gut)) var(--insp-w);
  grid-template-rows:minmax(0,1fr);
  background:var(--bg)}
.app.vp-compact{--nav-w:236px;--insp-w:318px}
.app.vp-narrow{--nav-w:64px;--insp-w:300px;--nav-gut:0px}
.app.vp-mobile{--nav-gut:0px;--insp-gut:0px;grid-template-columns:minmax(0,1fr)}
.m-only{display:none!important}
.app.vp-mobile .m-only{display:inline-flex!important}

/* ---------- 2.1 左栏：论文工作区列表（一个卡片 = 一篇论文的全部工作） ---------- */
.nav{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.brand{display:flex;align-items:center;gap:9px;padding:13px 14px 11px;border-bottom:1px solid var(--border)}
.mark{width:22px;height:22px;flex:none;border:1px solid var(--border-strong);border-radius:var(--r-sm);
  display:grid;place-items:center;font:400 12px/1 var(--font-display);color:var(--fg-strong);background:var(--surface)}
.brand-txt{min-width:0}
.brand-name{font:400 14.5px/1.15 var(--font-display);color:var(--fg-strong);letter-spacing:-.01em;white-space:nowrap}
.brand-sub{font:400 10px/1.35 var(--font-mono);color:var(--muted-2);letter-spacing:.02em;white-space:nowrap}
.nav-search{position:relative;margin:10px 12px 6px}
.nav-search .ic{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
.nav-search input{width:100%;height:30px;padding:0 44px 0 28px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);font-size:12.5px;color:var(--fg)}
.nav-search input::placeholder{color:var(--muted-2)}
.nav-search input:hover{border-color:var(--border-strong)}
.nav-search kbd{position:absolute;right:7px;top:50%;transform:translateY(-50%);font:400 10px/1 var(--font-mono);
  color:var(--muted-2);border:1px solid var(--border);border-radius:2px;padding:2px 4px;background:var(--surface-2)}
.nav-scroll{flex:1;min-height:0;overflow:auto;padding:4px 12px 16px}
.nav-sec{margin-top:12px}
.nav-sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 6px}
.nav-sec-head .act{display:flex;gap:2px}
.paper-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.paper{position:relative;display:block;width:100%;padding:9px 10px;text-align:left;color:var(--fg);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.paper:hover{background:var(--surface-2);border-color:var(--border-strong)}
.paper.sel{background:var(--accent-soft);border-color:var(--accent-line)}
.paper-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:12.5px;line-height:1.45;color:var(--fg)}
.paper.sel .paper-t{color:var(--fg-strong)}
.paper-m{display:block;margin-top:4px;font:400 10px/1.5 var(--font-mono);color:var(--muted-2)}
.paper-f{display:flex;align-items:center;gap:8px;margin-top:7px}
.paper-at{margin-left:auto;font:400 10px/1 var(--font-mono);color:var(--muted-2);white-space:nowrap}
.pchip{font:400 10px/1 var(--font-mono);border:1px solid var(--border);border-radius:2px;padding:3px 5px;color:var(--muted)}
.pchip.ok{border-color:var(--ok-soft);background:var(--ok-soft);color:var(--ok)}
.pchip.run{border-color:var(--run-soft);background:var(--run-soft);color:var(--run)}
.pchip.fail{border-color:var(--danger-soft);background:var(--danger-soft);color:var(--danger)}
.pchip.draft{border-color:var(--warn-soft);background:var(--warn-soft);color:var(--warn)}
.mini{display:block;height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.mini i{display:block;height:100%;background:var(--run);border-radius:2px}
.mini--ok i{background:var(--ok)}
.mini--fail i{background:var(--danger)}
.paper .mini{margin-top:8px}
.paper-ic,.paper-dot{display:none}
.paper-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px 10px;
  border:1px dashed var(--border-strong);border-radius:var(--r);color:var(--muted);font-size:12px}
.paper-add:hover{border-color:var(--accent);color:var(--fg);background:var(--surface-2)}
.paper-add .ic{color:var(--muted-2)}
.dot{width:6px;height:6px;flex:none;border-radius:50%;margin-top:5px;background:var(--muted-2)}
.dot.ok{background:var(--ok)}.dot.run{background:var(--run)}.dot.fail{background:var(--danger)}
.dot.warn{background:var(--warn)}.dot.idle{background:transparent;border:1px solid var(--border-strong)}
.ab-line1 .dot,.ed-head .dot,.tl-row .dot{margin-top:0}
.nav-foot{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.who{display:flex;align-items:center;gap:7px;font:400 11px/1 var(--font-mono);color:var(--muted)}
/* 窄屏：左栏收成图标轨（每篇论文一个方块 + 状态点） */
.app.vp-narrow .brand-txt,.app.vp-narrow .nav-search,.app.vp-narrow .nav-sec-head,
.app.vp-narrow .nav-foot{display:none}
.app.vp-narrow .brand{justify-content:center;padding:13px 8px 11px}
.app.vp-narrow .nav-scroll{padding:8px 10px 16px}
.app.vp-narrow .nav-sec{margin-top:6px}
.app.vp-narrow .paper-list{gap:4px}
.app.vp-narrow .paper{display:grid;place-items:center;height:38px;padding:0}
.app.vp-narrow .paper-t,.app.vp-narrow .paper-m,.app.vp-narrow .paper-f,
.app.vp-narrow .paper .mini{display:none}
.app.vp-narrow .paper-ic{display:block;color:var(--muted-2)}
.app.vp-narrow .paper.sel .paper-ic{color:var(--fg-strong)}
.app.vp-narrow .paper-dot{display:block;position:absolute;right:5px;bottom:5px;margin:0}
.app.vp-narrow .paper-add{height:34px;padding:0}
.app.vp-narrow .paper-add span:not(.ic){display:none}
.app.vp-mobile .nav{position:fixed;inset:0 auto 0 0;width:280px;z-index:75;transform:translateX(-100%);
  transition:transform .22s cubic-bezier(.2,.7,.2,1);border-right:1px solid var(--border-strong)}
.app.vp-mobile .nav.open{transform:none}

/* ---------- 2.1b 可调栏宽分隔条 ---------- */
.gutter{position:relative;min-width:0;cursor:col-resize;background:transparent;touch-action:none}
.gutter::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;transform:translateX(-50%);
  background:var(--border)}
.gutter:hover::before{background:var(--border-strong)}
.gutter.dragging::before{background:var(--accent)}
.gutter .grip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:2px;height:30px;
  border-radius:2px;background:var(--border-strong);opacity:0;transition:opacity .14s ease,background .14s ease}
.gutter:hover .grip,.gutter:focus-visible .grip,.gutter.dragging .grip{opacity:1}
.gutter.dragging .grip{background:var(--accent)}
.gutter:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:2px}
.gutter[aria-disabled="true"]{cursor:default;pointer-events:none}
body.resizing{cursor:col-resize}
body.resizing *{user-select:none!important}
/* 窄屏下左分隔条宽度为 0（--nav-gut:0px）但必须保留为栅格项：一旦 display:none，后面的所有列会整体左移一格 */
.app.vp-mobile #gutNav,.app.vp-mobile #gutInsp{display:none}
.app.vp-narrow #gutNav{pointer-events:none;cursor:default}
.app.vp-narrow #gutNav::before,.app.vp-narrow #gutNav .grip{display:none}
.app.vp-narrow .work{border-left:1px solid var(--border)}

/* ---------- 2.2 中栏：预览工具条（任务切换内联在这一行，不再占第二条横栏） ---------- */
.work{min-width:0;min-height:0;display:grid;grid-template-rows:40px minmax(0,1fr);
  background:var(--surface)}
.qsw{position:relative;display:flex;align-items:center;min-width:0;flex:0 1 auto}
.qsw-btn{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 8px;min-width:0;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);color:var(--fg)}
.qsw-btn:hover{border-color:var(--border-strong);background:var(--surface-3)}
.qsw-btn[aria-expanded="true"]{border-color:var(--accent-line);background:var(--accent-soft)}
.qsw-btn .dot{margin:0}
.qsw-nm{font-size:12.5px;line-height:1;color:var(--fg-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qsw-meta{font:400 10px/1 var(--font-mono);color:var(--muted-2);white-space:nowrap;flex:none}
.qsw-caret{display:flex;color:var(--muted-2);margin-left:1px;flex:none}
.app.vp-compact .qsw-meta,.app.vp-compact .ptoolbar .tag{display:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--r-sm);
  color:var(--muted);align-self:center}
.icon-btn:hover{background:var(--surface-3);color:var(--fg)}
.icon-btn[aria-disabled="true"]{color:var(--muted-2);opacity:.5;cursor:not-allowed}
.icon-btn.on{color:var(--fg-strong);background:var(--surface-3)}
.ptoolbar{position:relative;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);
  background:var(--surface);min-width:0}
/* 工具条宽度预算：论文名与右侧控件（页码/缩放/显示模式/状态）不可共存，故只在左栏变成抽屉的 vp-mobile 下显示论文名，
   其余宽度只留任务切换器；任务名是唯一可收缩省略的东西。 */
.pt-title{display:none}
.app.vp-mobile .pt-title{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto}
.app.vp-mobile .pt-title .nm{max-width:16ch}
.ptoolbar .pg,.ptoolbar .zoom,.ptoolbar .seg,.ptoolbar .state-chip,.ptoolbar .tag,.ptoolbar .icon-btn{flex:none}
/* 紧凑宽度：缩一档间距与图标按钮，让右上控件群整体收紧，保住任务名不被省略 */
.app.vp-compact .ptoolbar{gap:8px}
.app.vp-compact .ptoolbar .icon-btn{width:24px;height:24px}
.pt-title .nm{font:400 13px/1.2 var(--font-display);color:var(--fg-strong);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:16ch;min-width:0}
.tag{font:400 10px/1 var(--font-mono);letter-spacing:.04em;color:var(--muted-2);
  border:1px solid var(--border);border-radius:2px;padding:3px 5px;white-space:nowrap}
.spacer{flex:1 1 auto;min-width:10px}
.seg{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface-2);padding:1px;gap:1px}
.seg button{height:24px;padding:0 9px;border-radius:2px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--fg);background:var(--surface-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg-strong);border:1px solid var(--border-strong)}
.seg button[aria-disabled="true"]{color:var(--muted-2);opacity:.5;cursor:not-allowed}
.pg{display:inline-flex;align-items:center;gap:2px}
.pg .num{font:400 11.5px/1 var(--font-mono);color:var(--fg);min-width:52px;text-align:center}
.zoom{display:inline-flex;align-items:center;gap:2px}
.zoom .num{font:400 11.5px/1 var(--font-mono);color:var(--fg);min-width:40px;text-align:center}
.state-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--border);
  border-radius:100px;font-size:11.5px;color:var(--fg);white-space:nowrap;background:var(--surface)}
.state-chip .dot{margin:0}
.state-chip.run{border-color:var(--run-soft);background:var(--run-soft)}
.state-chip.fail{border-color:var(--danger-soft);background:var(--danger-soft);color:var(--danger)}
.state-chip.ok{background:var(--surface)}
.state-chip.draft{background:var(--warn-soft);border-color:var(--warn-soft)}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 2.3 画布与纸面 ---------- */
.canvas{position:relative;overflow:auto;background:var(--canvas);padding:22px 22px 30px;
  display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.notice{width:100%;max-width:720px;margin:0 auto;display:flex;gap:10px;padding:10px 12px;border:1px solid var(--danger);
  background:var(--danger-soft);border-radius:var(--r);color:var(--fg-strong)}
.notice .ic{color:var(--danger);margin-top:1px}
.notice-t{font-size:12.5px;font-weight:600;color:var(--danger)}
.notice-d{font-size:12px;color:var(--fg);margin-top:3px;line-height:1.55}
.notice-a{margin-top:7px;display:flex;gap:14px}
.lnk{font-size:12px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.lnk:hover{color:var(--accent-hover)}
.lnk.mut{color:var(--muted)}
.lnk.mut:hover{color:var(--fg)}
.page{--z:1;position:relative;width:calc(720px * var(--z));font:400 calc(13px * var(--z))/1.9 var(--font-body);
  background:var(--paper);border:1px solid var(--border-strong);color:var(--fg);margin:0 auto;
  padding:calc(30px * var(--z)) calc(60px * var(--z)) calc(40px * var(--z));flex:none}
.runhead{display:flex;justify-content:space-between;gap:12px;padding-bottom:calc(11px * var(--z));
  border-bottom:1px solid var(--border);margin-bottom:calc(24px * var(--z));
  font:400 .75em/1 var(--font-mono);color:var(--muted-2);letter-spacing:.04em}
.pg-h1{font:400 1.9em/1.3 var(--font-display);letter-spacing:-.01em;color:var(--fg-strong);
  text-align:center;margin:0 0 .5em}
.pg-authors{text-align:center;font-size:.95em;color:var(--fg);margin:0 0 .35em}
.pg-affil{text-align:center;font-size:.82em;color:var(--muted);margin:0 0 1.8em;
  padding-bottom:1.2em;border-bottom:1px solid var(--border)}
.pg-h2{font:400 1.2em/1.45 var(--font-display);color:var(--fg-strong);margin:1.5em 0 .6em}
.pg-h2:first-of-type{margin-top:0}
.para{position:relative;margin:0 0 .55em;font-size:1em;line-height:1.95;text-align:justify;text-indent:2em;
  padding:.14em .5em;margin-left:-.5em;margin-right:-.5em;border-radius:var(--r-sm);cursor:pointer;
  transition:background .12s ease}
.para:hover{background:var(--surface-3)}
.para.sel{background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent-line)}
.para .mk{position:absolute;left:-.95em;top:.72em;width:.5em;height:.5em;border-radius:50%;font-size:1em}
.para[data-state="draft"] .mk{background:var(--warn)}
.para[data-state="failed"] .mk{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.para .sel-tag{position:absolute;right:-3.7em;top:.2em;font:400 .62em/1 var(--font-mono);letter-spacing:.06em;
  color:var(--accent);background:var(--paper);border:1px solid var(--accent-line);border-radius:2px;padding:2px 3px}
.pg-formula{display:flex;align-items:center;gap:.8em;justify-content:center;margin:.9em 0 1em;
  font:italic 1.02em/1.6 var(--font-display);color:var(--fg-strong)}
.pg-formula .no{font:400 .8em/1 var(--font-mono);font-style:normal;color:var(--muted-2)}
.fig{margin:.9em 0 1.2em}
.fig-row{display:flex;align-items:stretch;gap:.3em;justify-content:center}
.fig-box{flex:1;min-width:0;border:1px solid var(--border-strong);background:var(--surface-2);
  border-radius:var(--r-sm);padding:.55em .4em;text-align:center;font-size:.78em;line-height:1.35;color:var(--fg)}
.fig-box.acc{border-color:var(--accent-line);background:var(--accent-soft);color:var(--fg-strong)}
.fig-arw{display:grid;place-items:center;color:var(--muted-2);font-size:.85em;padding:0 .1em}
.fig-bracket{display:flex;justify-content:space-between;font:400 .72em/1 var(--font-mono);color:var(--muted-2);
  border-top:1px solid var(--border);padding-top:.35em;margin-top:.4em}
.pg-cap{text-align:center;font-size:.82em;color:var(--muted);margin-top:.5em;line-height:1.6}
.pg-table{width:100%;border-collapse:collapse;font-size:.82em;margin:.4em 0 .6em}
.pg-table caption{caption-side:top;text-align:center;color:var(--muted);font-size:1em;padding-bottom:.6em}
.pg-table th,.pg-table td{padding:.42em .5em;text-align:left;border-bottom:1px solid var(--border)}
.pg-table thead th{border-bottom:1px solid var(--border-strong);font-weight:600;color:var(--fg-strong)}
.pg-table td.num,.pg-table th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.pg-table tbody tr:hover{background:var(--surface-2)}
.pg-refs{list-style:none;margin:.4em 0 0;padding:0;font-size:.86em;line-height:1.75}
.pg-refs li{padding-left:2em;text-indent:-2em;margin-bottom:.4em;color:var(--fg)}
.pg-refs li:hover{background:var(--surface-2)}
.pg-src{border-left:1px solid var(--border);padding-left:1em;margin:0 0 1em;font:italic .92em/1.8 var(--font-display);
  color:var(--muted)}
.pg-foot{margin-top:calc(26px * var(--z));padding-top:.7em;border-top:1px solid var(--border);
  text-align:center;font:400 .74em/1 var(--font-mono);color:var(--muted-2)}
.paper-skel{position:absolute;inset:0;background:
  linear-gradient(90deg,transparent 0 12%,var(--surface-3) 12% calc(12% + 1px),transparent calc(12% + 1px));
  pointer-events:none}
/* 空态 */
.empty{align-self:center;margin:auto;max-width:430px;text-align:center;padding:34px 26px;
  border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface)}
.empty-ic{width:40px;height:40px;margin:0 auto 14px;border:1px solid var(--border-strong);border-radius:var(--r-sm);
  display:grid;place-items:center;color:var(--muted);background:var(--surface-2)}
.empty-t{font:400 19px/1.35 var(--font-display);color:var(--fg-strong);margin:0 0 8px}
.empty-d{font-size:12.5px;color:var(--muted);line-height:1.75;margin:0 0 18px}
.empty-acts{display:flex;align-items:center;justify-content:center;gap:14px}

/* ---------- 2.4 段落详情坞（占右栏主体） ---------- */
/* 段落不用列表：用户在纸面上直接点段落，右栏就显示这一段的原文/译文，改字即时生效。
   详情报满右栏剩余高度：原文块固定，译文框拉满剩余空间。 */
.ed-dock{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.ed-head{flex:none;display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border)}
.ed-head .nm{font:400 12.5px/1 var(--font-mono);color:var(--fg-strong)}
.ed-head .st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.ed-body{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.ed-col{display:flex;flex-direction:column;min-width:0;min-height:0;padding:11px 14px}
.ed-col+.ed-col{flex:1 1 auto;border-top:1px solid var(--border)}
.ed-lbl{flex:none;font:400 10.5px/1 var(--font-mono);letter-spacing:.08em;color:var(--muted-2);margin-bottom:7px}
.ed-src{flex:none;font:italic 12.5px/1.75 var(--font-display);color:var(--muted);max-height:150px;overflow:auto}
.ed-ta{flex:1 1 auto;width:100%;min-height:96px;resize:none;padding:8px 9px;background:var(--paper);
  border:1px solid var(--border-strong);border-radius:var(--r-sm);font:400 13px/1.75 var(--font-body);color:var(--fg)}
.ed-ta:hover{border-color:var(--muted-2)}
.ed-ta:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.ed-meta{flex:none;display:flex;align-items:center;gap:10px;padding:0 14px 10px}

/* ---------- 2.5 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;
  border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--fg);
  font-size:12.5px;white-space:nowrap;transition:background .12s ease,border-color .12s ease}
.btn:hover{background:var(--surface-3);border-color:var(--muted-2)}
.btn:active{background:var(--surface-2)}
.btn .ic{color:var(--muted)}
.btn:hover .ic{color:var(--fg)}
.btn-primary{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--paper)}
.btn-primary .ic,.btn-primary:hover .ic{color:var(--paper)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ink{background:var(--fg-strong);border-color:var(--fg-strong);color:var(--paper)}
.btn-ink .ic,.btn-ink:hover .ic{color:var(--paper)}
.btn-ink:hover{background:oklch(30% 0.018 70);border-color:oklch(30% 0.018 70)}
.btn-sm{height:26px;padding:0 9px;font-size:11.5px}
.btn[aria-disabled="true"],.btn:disabled{background:var(--surface-2);border-color:var(--border);color:var(--muted-2);
  cursor:not-allowed;opacity:.75}
.btn[aria-disabled="true"] .ic{color:var(--muted-2)}
.btn-block{width:100%}

/* ---------- 2.6 底部操作区 ---------- */
.actionbar{position:relative;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:11px 14px;border-top:1px solid var(--border);background:var(--surface);min-height:56px}
.pbar{position:absolute;top:-1px;left:0;height:2px;background:var(--accent);transition:width .35s ease}
.pbar::after{content:"";position:absolute;right:0;top:-1px;bottom:-1px;width:26px;
  background:linear-gradient(90deg,transparent,var(--accent-soft))}
.ab-status{min-width:0;flex:1 1 260px}
.ab-line1{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg);flex-wrap:wrap}
.ab-line1 b{font-weight:600;color:var(--fg-strong)}
.ab-line2{font:400 11px/1.5 var(--font-mono);color:var(--muted-2);margin-top:4px}
.ab-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* 底部操作区住在右栏底部（中栏只留工具条 + 纸面）：竖排，状态在上、按钮在下 */
/* 底部操作区（编译/重新翻译）与段落详情同时出现：没有点选段落时，右栏保持安静。 */
.insp .actionbar{flex-direction:column;align-items:stretch;gap:9px;padding:11px 14px;border-top:1px solid var(--border)}
.insp .actionbar[hidden]{display:none}
.insp .ab-status{flex:0 0 auto;min-width:0}
.insp .ab-acts{justify-content:flex-start;gap:6px}

/* ---------- 2.7 右栏 inspector ---------- */
.insp{min-width:0;min-height:0;display:grid;grid-template-rows:44px minmax(0,1fr) auto;background:var(--bg)}
.insp-tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--border)}
.insp-tab{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;
  border-bottom:2px solid transparent;color:var(--muted);font:400 10.5px/1 var(--font-mono);letter-spacing:.05em}
.insp-tab:hover{background:var(--surface-2);color:var(--fg)}
.insp-tab[aria-selected="true"]{color:var(--fg-strong);border-bottom-color:var(--fg-strong);background:var(--surface)}
.insp-tab .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.vp-compact .insp-tab .lb,.app.vp-narrow .insp-tab .lb{display:none}
.insp-body{min-height:0;overflow:auto;padding:0 0 20px}
/* 段落视图：头部固定，段落详情占满剩余高度（右栏本体不滚） */
.insp-body.view-paras{display:flex;flex-direction:column;overflow:hidden;padding:0}
/* 事件流用容器查询：列宽不够时（右栏拖窄）自己退回一列 */
.insp-body.view-events{container-type:inline-size}
.app.vp-mobile .insp{position:fixed;inset:0 0 0 auto;width:340px;max-width:88vw;z-index:75;
  border-left:1px solid var(--border-strong);transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.7,.2,1)}
.app.vp-mobile .insp.open{transform:none}
.ip-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 14px 9px}
.ip-head .t{font:400 14px/1.2 var(--font-display);color:var(--fg-strong)}
.ip-head .m{font:400 10.5px/1 var(--font-mono);color:var(--muted-2);text-align:right;line-height:1.5}
.ihint{padding:10px 14px;font-size:11.5px;line-height:1.7;color:var(--muted-2);border-top:1px solid var(--border);margin-top:8px}
.panel-empty{margin:14px 14px 0;padding:18px 16px;border:1px dashed var(--border-strong);border-radius:var(--r);
  text-align:center;background:var(--surface-2)}
.panel-empty .ic{margin:0 auto 9px;color:var(--muted-2)}
.panel-empty .t{font:400 14px/1.3 var(--font-display);color:var(--fg-strong);margin-bottom:6px}
.panel-empty .d{font-size:11.5px;line-height:1.7;color:var(--muted)}

/* 时间线：两条流水（翻译与检查 / 编译与预览）并列成两列，共用同一套节点语法；
   列宽窄时（右栏拖到最窄）自动退回一列，以免每列只剩不到 110px。 */
.tl{display:grid;grid-template-columns:1fr 1fr;padding:2px 14px 8px}
.tl-track{min-width:0;padding:8px 0 4px;container-type:inline-size}
.tl-track:first-child{padding-right:12px}
.tl-track+.tl-track{border-left:1px solid var(--border);padding-left:12px}
@container (max-width:320px){
  .tl{grid-template-columns:1fr}
  .tl-track:first-child{padding-right:0}
  .tl-track+.tl-track{border-left:0;border-top:1px solid var(--border);margin-top:6px}
}
.tl-head{display:flex;align-items:center;gap:6px;margin-bottom:9px;min-width:0}
.tl-head .ic{color:var(--muted-2);flex:none}
.tl-head-name{font-size:11.5px;color:var(--fg-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-head-meta{margin-left:auto;flex:none;font:400 9.5px/1 var(--font-mono);color:var(--muted-2)}
.tl-nodes{position:relative;margin:0;padding:0;list-style:none}
.tl-node{position:relative;padding:0 0 12px 26px}
.tl-node:last-child{padding-bottom:2px}
.tl-node::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:1px;background:var(--border)}
.tl-node:last-child::before{display:none}
/* 节点标记 = 类型图标；状态只改颜色与描边，不换形状 */
.tl-mark{position:absolute;left:0;top:1px;width:20px;height:20px;border:1px solid var(--border-strong);
  border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--fg-2)}
.tl-node[data-state="running"] .tl-mark{border-color:var(--run);color:var(--run);box-shadow:0 0 0 3px var(--run-soft)}
.tl-node[data-state="failed"] .tl-mark{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.tl-node[data-state="skipped"] .tl-mark{border-style:dashed;color:var(--muted-2)}
.tl-row{display:flex;align-items:center;gap:6px;min-width:0}
.tl-type{font:400 9.5px/1 var(--font-mono);letter-spacing:.05em;color:var(--fg);border:1px solid var(--border);
  border-radius:2px;padding:3px 4px;background:var(--surface);flex:none}
.tl-idx{margin-left:auto;flex:none;font:400 9.5px/1 var(--font-mono);color:var(--muted-2)}
.tl-txt{margin-top:4px;font-size:11.5px;line-height:1.55;color:var(--fg);overflow-wrap:anywhere}
.tl-node.clickable .tl-txt{cursor:pointer}
.tl-more{margin-top:5px;font:400 10px/1 var(--font-mono);color:var(--muted-2);cursor:pointer}
.tl-node:hover .tl-more,.tl-more:hover,.tl-more:focus-visible{color:var(--accent)}
.tl-node[data-state="failed"] .tl-more{color:var(--danger)}
.tl-detail{margin-top:8px;padding:8px 9px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface);font:400 10.5px/1.7 var(--font-mono);color:var(--muted)}
.tl-detail div{display:flex;gap:7px}
.tl-detail .k{color:var(--muted-2);flex:none;width:40px}
.tl-detail .v{color:var(--fg);min-width:0;word-break:break-word;overflow-wrap:anywhere}
.tl-err{background:var(--danger-soft);border-color:var(--danger);color:var(--fg)}
.tl-err .k{color:var(--danger)}
.tl-acts{margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}
.tl-empty{padding:0 0 4px 26px;font-size:11px;line-height:1.6;color:var(--muted-2)}
/* 两列时每列只有 150–200px：节点详情改成「标签一行 / 值一行」，否则值会被拆成五六个词 */
@container (max-width:210px){
  .tl-detail div{display:block}
  .tl-detail .k{display:block;width:auto;margin-bottom:1px}
}

/* 归档 */
.ver{margin:0 12px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ver.cur{border-color:var(--border-strong);background:var(--surface)}
.ver-head{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--row-line)}
.ver-no{font:400 15px/1 var(--font-display);color:var(--fg-strong);letter-spacing:-.01em}
.ver-badge{font:400 9.5px/1 var(--font-mono);letter-spacing:.06em;color:var(--accent);
  border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:2px;padding:3px 5px}
.ver-at{margin-left:auto;font:400 10px/1 var(--font-mono);color:var(--muted-2)}
.ver-body{padding:9px 11px}
.ver-mode{font-size:12px;color:var(--fg);line-height:1.5}
.ver-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:8px;
  font:400 10.5px/1.6 var(--font-mono);color:var(--muted-2)}
.ver-grid b{font-weight:400;color:var(--fg);font-variant-numeric:tabular-nums}
.ver-acts{display:flex;gap:7px;padding:9px 11px;border-top:1px solid var(--row-line);flex-wrap:wrap}
.ver-hist{margin:2px 14px 0;padding:10px 0 0;border-top:1px solid var(--border);
  font:400 10.5px/1.6 var(--font-mono);color:var(--muted-2)}

/* ---------- 2.8 抽屉 / 遮罩 / 提示 ---------- */
.scrim{position:fixed;inset:0;background:oklch(26% 0.02 70/.3);opacity:0;pointer-events:none;
  transition:opacity .22s ease;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:404px;max-width:92vw;background:var(--surface);
  border-left:1px solid var(--border-strong);z-index:80;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  transform:translateX(101%);transition:transform .26s cubic-bezier(.2,.7,.2,1);visibility:hidden}
.drawer.on{transform:none;visibility:visible;box-shadow:-30px 0 60px -30px oklch(30% .02 70/.35)}
.dr-head{padding:16px 18px 14px;border-bottom:1px solid var(--border)}
.dr-head .t{font:400 20px/1.3 var(--font-display);color:var(--fg-strong);margin:0}
.dr-head .d{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.7}
.dr-body{padding:16px 18px;overflow:auto}
.dr-foot{display:flex;align-items:center;gap:10px;padding:13px 18px;border-top:1px solid var(--border);background:var(--surface-2)}
.dr-foot .note{flex:1;font:400 10.5px/1.5 var(--font-mono);color:var(--muted-2)}
.opt{position:relative;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);
  padding:12px;margin-bottom:10px;cursor:pointer;display:block}
.opt:hover{border-color:var(--border-strong);background:var(--surface-2)}
.opt.is-sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.is-off{cursor:not-allowed;background:var(--surface-2)}
.opt.is-off:hover{border-color:var(--border);background:var(--surface-2)}
.opt.is-off .opt-t{color:var(--muted-2)}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt-top{display:flex;align-items:center;gap:9px}
.radio{width:15px;height:15px;flex:none;border:1px solid var(--border-strong);border-radius:50%;
  display:grid;place-items:center;background:var(--surface)}
.opt.is-sel .radio{border-color:var(--accent)}
.opt.is-sel .radio::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.opt-t{font-size:13.5px;font-weight:600;color:var(--fg-strong)}
.opt-b{font:400 9.5px/1 var(--font-mono);letter-spacing:.05em;color:var(--accent);border:1px solid var(--accent-line);
  background:var(--paper);border-radius:2px;padding:3px 5px}
.opt-d{font-size:12px;color:var(--muted);line-height:1.7;margin-top:8px}
.opt-list{list-style:none;margin:8px 0 0;padding:0}
.opt-list li{position:relative;padding-left:15px;font-size:12px;line-height:1.75;color:var(--fg)}
.opt-list li::before{content:"";position:absolute;left:3px;top:.66em;width:4px;height:4px;border-radius:50%;background:var(--muted-2)}
.opt-meta{margin-top:9px;padding-top:8px;border-top:1px solid var(--border);
  font:400 10.5px/1 var(--font-mono);color:var(--muted-2);display:flex;gap:12px;flex-wrap:wrap}
.opt.is-sel .opt-meta{border-top-color:var(--accent-line)}
.warnbox{margin-top:10px;padding:9px 10px;border:1px solid var(--warn);border-radius:var(--r-sm);
  background:var(--warn-soft);font-size:11.5px;line-height:1.7;color:var(--fg-strong)}
.warnbox b{color:var(--warn)}
.ack{display:flex;align-items:flex-start;gap:8px;margin-top:9px;font-size:11.5px;line-height:1.6;color:var(--fg)}
.ack input{width:14px;height:14px;margin-top:2px;accent-color:var(--accent-strong)}
.dr-sec{font:400 10.5px/1 var(--font-mono);letter-spacing:.09em;color:var(--muted-2);margin:18px 0 9px}
.diffbar{display:flex;align-items:center;gap:8px;font:400 10.5px/1.6 var(--font-mono);color:var(--muted)}
.diffbar .sw{width:22px;height:5px;border-radius:2px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  z-index:90;display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--r);transition:opacity .2s ease,transform .2s ease;max-width:560px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .ic{color:var(--ok)}
.toast .ic.warn{color:var(--warn)}
.toast .tx{font-size:12.5px;color:var(--fg-strong);line-height:1.5}
.toast .sub{font:400 10.5px/1.5 var(--font-mono);color:var(--muted-2)}
.app.vp-mobile .toast{left:16px;right:16px;transform:translateY(14px);max-width:none}
.app.vp-mobile .toast.on{transform:translateY(0)}
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
  background:var(--fg-strong);color:var(--paper);font:400 11px/1.4 var(--font-body);padding:5px 8px;
  border-radius:var(--r-sm);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s ease;z-index:95}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1}
[data-tip].tip-down::after{bottom:auto;top:calc(100% + 7px)}
[data-tip].tip-right::after{bottom:auto;left:calc(100% + 8px);top:50%;transform:translateY(-50%)}
[data-tip].tip-wide::after{white-space:normal;width:250px;line-height:1.55;text-align:left}
/* ---------- 2.9 新建任务浮层 ---------- */
.pop{position:absolute;top:calc(100% + 6px);z-index:55;width:300px;max-width:calc(100% - 12px);padding:6px;
  background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);
  box-shadow:0 18px 38px -22px oklch(28% 0.02 70/.45)}
.pop-head{font:400 10.5px/1 var(--font-mono);letter-spacing:.08em;color:var(--muted-2);padding:7px 8px 8px}
.pop-itm{display:flex;gap:9px;width:100%;padding:8px;border:1px solid transparent;border-radius:var(--r-sm);text-align:left}
.pop-itm:hover{background:var(--surface-2);border-color:var(--border)}
.pop-itm .pi-ic{color:var(--muted-2);margin-top:1px}
.pi-dot{display:flex;align-items:center;justify-content:center;width:15px}
.pi-dot .dot{margin:0;width:7px;height:7px}
.pi-cur{margin-left:6px;font:400 9.5px/1 var(--font-mono);color:var(--accent);border:1px solid var(--accent-line);
  background:var(--accent-soft);border-radius:2px;padding:2px 4px;vertical-align:1px}
.pop-empty{padding:6px 8px 10px;font-size:11.5px;line-height:1.6;color:var(--muted-2)}
.pop-itm:hover .pi-ic{color:var(--accent)}
.pi-body{min-width:0}
.pi-t{display:block;font-size:12.5px;color:var(--fg-strong)}
.pi-d{display:block;font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:3px}
.pop-foot{margin-top:5px;padding:8px;border-top:1px solid var(--border);
  font:400 10.5px/1.6 var(--font-mono);color:var(--muted-2)}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===================== 左栏 ===================== -->
  <aside class="nav" id="nav" data-od-id="nav-rail">
    <div class="brand" data-od-id="brand-lockup">
      <div class="mark" aria-hidden="true">译</div>
      <div class="brand-txt">
        <div class="brand-name">ieeTranslater</div>
        <div class="brand-sub">学术 PDF 翻译工作台</div>
      </div>
    </div>

    <div class="nav-search">
      <span id="searchIcon"></span>
      <input id="navSearch" type="search" placeholder="搜索论文、任务或段落" aria-label="搜索论文、任务或段落">
      <kbd>⌘K</kbd>
    </div>

    <div class="nav-scroll" id="navScroll">
      <div class="nav-sec">
        <div class="nav-sec-head">
          <span class="eyebrow">论文 · <span id="paperCount"></span></span>
          <span class="act">
            <button class="icon-btn" data-act="upload" aria-label="上传论文" style="width:22px;height:22px" id="upIcon"></button>
          </span>
        </div>
        <ul class="paper-list" id="paperMount"></ul>
      </div>

const TXT={
  abs:'摘要——语义通信将传输目标从比特级无差错转向任务层面的语义保真，为带宽受限场景提供了新的设计空间。本文提出一种信道自适应的联合信源信道编码框架，通过两阶段训练策略与稀疏约束，在不增加推理开销的前提下提升了对信道估计误差的鲁棒性。在加性高斯白噪声与瑞利块衰落两种信道下的实验表明，该框架在低信噪比区间取得了稳定的等效增益，且在高信噪比区间的性能损失可以忽略。',
  kw:'关键词——语义通信；联合信源信道编码；信道自适应；瑞利衰落；低时延推理',
  intro:['语义通信的基本思想是放弃比特级无差错传输这一传统目标，转而在接收端保证任务层面的语义保真度。这一转变使得系统可以在信噪比受限的条件下，用更少的信道资源完成同等质量的推断任务。',
    '近年来，基于深度学习的联合信源信道编码在图像与文本传输任务上取得了明显优于分离式方案的性能。其核心做法是让神经网络直接学习从原始信号到信道符号的映射，从而绕开显式的信源与信道编码分离假设。',
    '尽管端到端训练在仿真中表现良好，实际部署仍面临两个困难：一是信道状态在训练与推理阶段往往不一致，二是语义表示缺乏显式的可解释结构。本文针对前者提出一种信道自适应的训练策略，并给出后者的一种结构化设计。'],
  related:['早期的语义通信研究多沿用香农信息论的框架，通过语义相似度或任务准确率重新定义失真度量。这类工作为语义层面的性能评价提供了基础，但通常假设信道条件在整段传输内保持不变。',
    '与本文最接近的是关于注意力机制语义编码器的研究。该工作将自注意力用于提取语义特征，并在加性高斯白噪声信道上验证了其有效性；不过其解码端仍依赖固定的信道估计误差假设。',
    '另一类工作关注语义通信与正交频分复用、可重构智能表面等物理层技术的结合。这些方法在链路层面带来了可观增益，但语义编码器与物理层参数之间的耦合关系尚未被充分刻画。'],
  model:['本文考虑一个点对点的语义通信系统。发送端观测到的原始信号被映射为语义特征向量，随后经无线信道传输至接收端，由解码网络重建任务相关的语义信息。',
    '设 x ∈ ℝⁿ 表示发送端的输入信号，y ∈ ℝᵐ 表示接收端的重建信号。令 f_θ(·) 与 g_φ(·) 分别表示参数为 θ 的编码器与参数为 φ 的解码器，则联合信源信道编码问题可写为',
    '其中 h 表示信道状态，d(·,·) 为任务相关的失真度量。与传统的分离式方案不同，上述联合优化不再显式假设信源与信道相互独立，而是允许编码器在有限带宽下优先保留对下游任务最有价值的语义成分。',
    '式 (1) 的求解依赖对信道分布的准确刻画。在快衰落场景中，信道状态随符号变化，直接对期望求导会引入难以承受的方差。为此，本文采用两阶段近似策略：先在固定信噪比下获得稳定的初始解，再在信噪比区间内引入扰动。',
    '图 1 给出了本文方法的整体结构。原始信号经特征提取网络得到语义表示，再经功率归一化送入信道；接收端完成信道均衡后，由解码网络重建语义表示，并交由任务头输出最终结果。',
    '需要说明的是，式 (1) 的失真度量并不限定为均方误差。当下游任务为分类或检索时，可以使用交叉熵或对比损失替代，此时编码器的优化目标相应变为任务损失的期望。'],
  modelSrc:'Here h denotes the channel state and d(·,·) is a task-dependent distortion measure. Unlike the conventional separated source–channel coding scheme, the joint formulation no longer assumes independence between source and channel; instead it allows the encoder to preserve, under a limited bandwidth budget, the semantic components that matter most to the downstream task.',
  tail:['式 (1) 的期望无法直接求导，本文采用蒙特卡洛近似：在每个小批次内采样 K 个信道实现，以样本均值替代期望，并对梯度方差进行裁剪。',
    '为控制计算开销，我们在训练初期使用较小的 K 值，随训练推进逐步增大。这一安排在实验中并未造成明显的收敛困难，反而缩短了单个轮次的耗时。',
    '表 1 给出了不同模块组合下的消融结果。可以看出，各模块的贡献在不同信噪比区间并不一致，这提示设计语义编码器时需要结合目标工作点进行取舍。',
    '需要指出，稀疏约束的权重对最终性能较为敏感。权重过大将削弱语义表示的容量，权重过小则难以在低信噪比区间发挥作用，本文通过验证集上的网格搜索确定其取值。',
    '综合以上分析，本文的优化目标可以理解为在失真、功率与稀疏度三者之间寻找平衡点。下一节将讨论编码器的具体实现。',

  design:['语义编码器由特征提取网络与线性投影层组成。特征提取网络采用轻量卷积结构，在保证推理时延的前提下扩大感受野；投影层负责将特征映射到与信道符号维度一致的向量空间。',
    '为了在有限带宽下保留关键语义，我们在训练目标中引入稀疏约束，使部分语义维度在低信噪比时被自适应抑制。该机制与经典的率失真折中在形式上并不等价，但在实验中能有效降低高噪声区间的退化速度。',
    '解码网络的结构与编码网络近似对称。考虑到接收端通常具备更充裕的算力，我们在解码端引入一层额外的细化模块，用于消除信道均衡残留的相位误差。',
    '训练采用两阶段策略：第一阶段在固定信噪比下预训练编码器与解码器；第二阶段在信噪比区间内随机采样，并对信道估计误差进行扰动，以提升模型的鲁棒性。',
    '我们使用 Adam 优化器，初始学习率设为 1e-3，并在验证损失连续三个轮次未下降时将学习率减半。批大小固定为 64，总训练轮数为 120。',
    '为防止功率归一化层在低信噪比时输出过小的信号幅度，我们在损失函数中加入一项功率惩罚，其权重在训练初期较大，随后线性衰减至零。'],
  setup:['实验在公开图像数据集与自建文本语料上分别进行。图像任务采用 32×32 与 64×64 两种分辨率，文本任务采用长度为 128 个词元的中文句子对。',
    '对比方法包括分离式 JPEG2000 加 LDPC 方案、固定信噪比训练的联合编码方案，以及本文提出的信道自适应方案。所有神经网络方法使用相同的参数量预算，以保证比较的公平性。',
    '评价指标方面，图像任务采用峰值信噪比与结构相似度，文本任务采用双语评估替补指标与任务准确率。每个配置重复五次实验并报告均值与标准差。',
    '信道模型覆盖加性高斯白噪声与瑞利块衰落两种场景。在瑞利衰落条件下，我们假设接收端可获得不完美的信道状态信息，估计误差服从均值为零的高斯分布。',

  results:['在加性高斯白噪声信道上，本文方法在低信噪比区间相较固定信噪比训练方案取得了约 1.8 dB 的等效增益，且在高信噪比区间的性能损失不超过 0.2 dB。',

/* ============================================================
   D2. 栏宽可调（拖动 / 键盘 / 双击复位）
   未手动拖动时宽度完全交给断点接管；拖动后写入内联变量并持久化

const CENTER_MIN=520;
const GW={nav:{min:200,max:420,key:'navW',sel:'#nav',label:'导航栏'},
          insp:{min:260,max:520,key:'inspW',sel:'#insp',label:'检查器'}};
function applyWidths(){
  const a=$('#app'),w=vw();
  if(S.navW&&w>=1180)a.style.setProperty('--nav-w',S.navW+'px');else a.style.removeProperty('--nav-w');
  if(S.inspW&&w>=980)a.style.setProperty('--insp-w',S.inspW+'px');else a.style.removeProperty('--insp-w');
}
function clampW(which,w){
  const g=GW[which],other=(which==='nav'?GW.insp:GW.nav);
  const otherW=$(other.sel).getBoundingClientRect().width;
  const ceiling=Math.max(g.min,vw()-otherW-CENTER_MIN-26);
  return Math.round(Math.max(g.min,Math.min(Math.min(g.max,ceiling),w)));
}
function updateGutterAria(){
  const w=vw();
  [['gutNav','nav',1180],['gutInsp','insp',980]].forEach(function(x){
    const el=document.getElementById(x[0]),which=x[1],off=w<x[2];
    el.setAttribute('aria-disabled',off?'true':'false');
    el.tabIndex=off?-1:0;
    el.setAttribute('aria-valuenow',Math.round($(GW[which].sel).getBoundingClientRect().width));
    el.setAttribute('aria-valuemin',GW[which].min);
    el.setAttribute('aria-valuemax',GW[which].max);
    el.setAttribute('data-tip',off?'窗口偏窄，栏宽由断点自动接管':'拖动调整宽度 · 双击恢复默认');
  });
}
function setupGutters(){
  [['gutNav','nav'],['gutInsp','insp']].forEach(function(pair){
    const el=document.getElementById(pair[0]),which=pair[1],g=GW[which];
    el.addEventListener('pointerdown',function(e){
      if(el.getAttribute('aria-disabled')==='true')return;
      e.preventDefault();
      const rect=$('#app').getBoundingClientRect();
      const move=function(ev){
        S[g.key]=clampW(which,which==='nav'?(ev.clientX-rect.left):(rect.right-ev.clientX));
        applyWidths();updateGutterAria();
      };
      const up=function(){
        el.classList.remove('dragging');document.body.classList.remove('resizing');
        el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);
        el.removeEventListener('pointercancel',up);
        save();renderTaskSwitch();updateGutterAria();
      };
      el.classList.add('dragging');document.body.classList.add('resizing');
      if(el.setPointerCapture)el.setPointerCapture(e.pointerId);
      el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);
      el.addEventListener('pointercancel',up);
    });
    el.addEventListener('dblclick',function(){
      if(el.getAttribute('aria-disabled')==='true')return;
      S[g.key]=null;applyWidths();updateGutterAria();save();renderTaskSwitch();
      toast('已恢复默认栏宽',g.label+'宽度重新交给断点自适应','ok');
    });
    /* 键盘：分隔条获得焦点后，方向键按「移动边界」的直觉调整 */
    el.addEventListener('keydown',function(e){
      if(el.getAttribute('aria-disabled')==='true')return;
      const cur=$(g.sel).getBoundingClientRect().width,st=e.shiftKey?48:16;
      let w=null;
      if(which==='nav'&&e.key==='ArrowRight')w=cur+st;
      else if(which==='nav'&&e.key==='ArrowLeft')w=cur-st;
      else if(which==='insp'&&e.key==='ArrowLeft')w=cur+st;
      else if(which==='insp'&&e.key==='ArrowRight')w=cur-st;
      else if(e.key==='Home')w=g.min;
      else if(e.key==='End')w=g.max;
      if(w===null)return;
      e.preventDefault();
      S[g.key]=clampW(which,w);applyWidths();updateGutterAria();save();renderTaskSwitch();
    });
  });
}

      +'<i style="width:'+(doc.status==='running'?Math.round((doc.progress||0)*100):100)+'%"></i></span>');

    h+='<li><button class="paper'+(sel?' sel':'')+'" data-act="pick-doc" data-id="'+doc.id+'" data-od-id="paper-'+doc.id+'"'
      +' aria-current="'+(sel?'true':'false')+'" title="'+doc.name+' · '+doc.chip+'">'
      +'<span class="paper-ic">'+ic('file',14)+'</span>'
      +'<span class="paper-dot dot '+tone+'"></span>'
      +'<span class="paper-t">'+doc.name+'</span>'

const NEW_TASKS_O=['full','terms','math','refs'];
const NEW_TASKS={
  full:{name:'全文翻译',icon:'translate',desc:'按段落翻译整份文档，保留公式、图表与参考文献结构。'},
  terms:{name:'术语与专名',icon:'list',desc:'抽取术语与专名候选，统一译名后写回全文。'},

function tabMeta(id){
  const t=TASKS[id];if(!t)return '';

  if(t.status==='success')return t.ver||'已归档';
  if(t.status==='failed')return '待处理';
  if(t.status==='draft')return '待确认';
  return '未开始';
}
function renderTaskSwitch(){

      +'<p style="font:400 11px/1.7 var(--font-mono);color:var(--muted-2);margin-top:1.4em;text-indent:0">示例数据仅对正在编辑的段落保留英文原文层，其余段落以译文为准。</p>';

function paraDock(t,state){

    +'<div class="ed-head"><span class="nm">第 '+p.id.replace('P','')+' 段</span>'
    +'<span class="st"><span class="dot '+STATUS_DOT[st==='done'?'success':st]+'"></span>'+stcn+'</span>'

    +'<div class="ed-body">'
      +'<div class="ed-col"><div class="ed-lbl">原文 · EN</div><div class="ed-src">'+(p.src||'本页原文层未收录（示例数据仅第 3 页提供原文对照）。')+'</div></div>'
      +'<div class="ed-col"><div class="ed-lbl">译文 · ZH</div>'
      +'<textarea class="ed-ta" id="edTa" aria-label="段落译文" spellcheck="false">'+p.text.replace(/</g,'&lt;')+'</textarea></div>'

    +'<div class="ed-meta"><span class="eyebrow" id="edState">改动即时生效</span>'

/* 详情坞接线：改字时只更新段落模型与字数（不重渲整块，否则光标会丢）；失焦后才把纸面刷新 */
function bindDock(){
  const ta=$('#edTa');if(!ta)return;
  const p=paraById(S.para);if(!p)return;
  ta.addEventListener('input',()=>{
    p.text=ta.value;
    const c=$('#edCount');if(c)c.textContent=ta.value.replace(/\s/g,'').length+' 字';
    const s=$('#edState');if(s)s.textContent='编辑中…';
  });
  ta.addEventListener('blur',()=>{
    const s=$('#edState');if(s)s.textContent='已同步到草稿';
    renderCanvas();
  });
}

/* ============================================================
   K. 底部操作区
   ============================================================ */
/* 底部操作区默认不显示：点选段落后与段落详情一同出现。
   唯一的例外是运行中——否则「取消」会没有入口（运行期间段落详情本身是不出的）。 */
function syncActionbar(){
  const ab=$('.actionbar');if(!ab)return;
  const t=T();
  ab.hidden=!(S.para||(t&&t.status==='running'));
}
function renderActions(){
  syncActionbar();
  const t=T(),d=D(),l1=$('#abLine1'),l2=$('#abLine2'),a=$('#abActs'),pb=$('#pbar');
  const st=t?t.status:'empty';
  pb.style.display=(st==='running')?'block':'none';
  if(st==='running')pb.style.width=Math.round((t.progress||0.3)*100)+'%';
  if(st==='empty'){
    l1.innerHTML='<span class="dot idle"></span><span>尚未开始翻译</span>';
    l2.textContent='开始翻译后，工作台会解析 PDF 结构并逐段生成译文；原文件不会被修改。';
    a.innerHTML=btn('recompile','只重新编译',{disabled:true,icon:'compile',tip:'当前没有可编译的译文'})
      +btn('retranslate','重新翻译',{disabled:true,icon:'refresh',tip:'请先开始一次翻译'});
    return;
  }
  if(st==='running'){
    const compiling=S.run&&(S.run.kind==='compile'||S.run.kind==='recompile');
    if(compiling){
      const pg=Math.max(1,Math.round((t.progress||0)*d.pages));
      l1.innerHTML='<span class="dot run pulse"></span><span>正在编译 · <b>'+pg+' / '+d.pages+' 页</b></span>'
        +'<span class="eyebrow">'+S.run.label+'</span>';
      l2.textContent=(S.run.callsModel?'本次编译会读取现有译文并重新翻译全部段落，完成后覆盖当前版本。':'编译只读取现有译文并重新排版，不会调用翻译模型，也不会修改任何段落文本。');
    }else{
      const pg=t.progress?Math.round(t.progress*d.pages):9;
      l1.innerHTML='<span class="dot run pulse"></span><span>正在翻译 · <b>'+pg+' / '+d.pages+' 页</b></span>'
        +'<span class="eyebrow">预计剩余 04:12</span>';
      l2.textContent='可以随时取消；已完成页面的译文会保留，不会回滚。';
    }
    a.innerHTML=btn('cancel',compiling?'取消编译':'取消翻译',{icon:'stop'})
      +btn('recompile','只重新编译',{disabled:true,icon:'compile',tip:'当前正在运行，暂不可再次触发'})
      +btn('retranslate','重新翻译',{disabled:true,icon:'refresh',tip:'当前正在运行，暂不可再次触发'});
    return;
  }
  if(st==='failed'){
    l1.innerHTML='<span class="dot fail"></span><span>翻译失败 · <b>'+(t.para?Object.keys(t.para).filter(k=>t.para[k]==='failed').length:1)+'</b> 处待处理</span>'
      +'<span class="eyebrow">'+(t.ranAt||'')+'</span>';
    l2.textContent='重新翻译会调用翻译模型；只重新编译仅重新排版现有译文，不会再次调用翻译模型。';
    a.innerHTML=btn('recompile','只重新编译',{icon:'compile',tip:'仅重新排版 · 不会调用翻译模型',tipWide:true,id:'btn-recompile'})
      +btn('retranslate','重新翻译',{kind:'primary',icon:'refresh',id:'btn-retranslate'});
    return;
  }
  if(st==='draft'){
    l1.innerHTML='<span class="dot warn"></span><span><b>'+(t.para?Object.keys(t.para).filter(k=>t.para[k]==='draft').length:2)+'</b> 处术语待人工确认</span>'
      +'<span class="eyebrow">'+(t.ranAt||'')+'</span>';
    l2.textContent='确认术语后即可编译；未确认的术语会以原文标注形式保留在译文中。';
    a.innerHTML=btn('recompile','只重新编译',{icon:'compile',tip:'使用当前术语表重新排版 · 不会调用翻译模型',tipWide:true})
      +btn('retranslate','重新翻译',{icon:'refresh'})
      +btn('compile','编译',{kind:'primary',icon:'compile',id:'btn-compile'});
    return;
  }
  /* success */
  const changed=12,v=t.ver||'v1';
  l1.innerHTML='<span class="dot ok"></span><span>已编译 <b>'+v+'</b></span><span class="eyebrow">'+t.ranAt+'</span>'
    +'<span class="eyebrow">'+t.scope+' · 全文通过检查</span>';

function panelParas(t,d){
  if(!t)return '<div class="panel-empty">'+ic('doc',20)+'<div class="t">暂无段落</div><div class="d">先为「'+d.name+'」创建翻译任务；之后在纸面上点选段落，就能在这里编辑译文。</div></div>';
  if(t.status==='empty')return '<div class="panel-empty">'+ic('spark',20)+'<div class="t">该任务尚未开始</div><div class="d">「'+t.name+'」还没有可编辑的段落。开始翻译后，在纸面上点选段落即可在这里编辑原文与译文。</div></div>';
  const state=p=>((t.para&&t.para[p.id])?t.para[p.id]:'done');
  const cnt=k=>PARA.filter(p=>state(p)===k).length;
  const done=PARA.length-cnt('draft')-cnt('failed');
  const hdr='<div class="ip-head"><div><div class="t">段落</div></div>'
    +'<div class="m">全文 '+PARA.length+' 段<br>已完成 '+done+' · 待确认 '+cnt('draft')+' · 失败 '+cnt('failed')+'</div></div>';

    return hdr+'<div class="panel-empty">'+ic('doc',20)
      +'<div class="t">没有段落</div><div class="d">该任务还没有可编辑的段落。</div></div>';
  }
  /* 运行期间不开放段落编辑：翻译/编译正在写入，等本次运行结束再改 */
  if(t.status==='running'){
    return hdr+'<div class="panel-empty">'+ic('pulse',20)
      +'<div class="t">运行进行中</div><div class="d">翻译与编译正在写入，段落译文暂不可编辑。本次运行结束后，在纸面上点选段落即可在这里修改。</div></div>';
  }
  /* 不给段落列表：段落在纸面（中栏）上直接点选，右栏只展示并编辑当前那一段 */
  const dock=paraDock(t,state);

    return hdr+'<div class="panel-empty">'+ic('caretD',20)
      +'<div class="t">请先在纸面上点选段落</div><div class="d">点中任一段落后，这段的原文与译文会出现在这里，可以直接修改译文；改动即时生效，失焦后写回草稿。</div></div>';
  }
  return hdr+dock;
}
/* 事件节点类型 → 图标：两条时间线共用同一套映射 */

function panelEvents(t,d){

        +(n.extra?n.extra.map(kv=>'<div><span class="k">'+kv[0]+'</span><span class="v">'+kv[1]+'</span></div>').join(''):'')

/* 遮罩只服务于「有东西盖住主体」的时刻：编译抽屉，以及 vp-mobile 下的左栏/右栏抽屉。

}

        +'<p class="opt-d">'+(v?('以 '+v+' 为基础，只重新编译受影响的 12 个段落，其余页面复用既有译文。'):'当前没有可复用的已编译版本；首次编译完成后才能使用增量修复。')+'</p>'
        +(v?('<ul class="opt-list"><li>复用 '+v+' 的译文，<b>不会调用翻译模型</b></li><li>保留 5 处人工修改与全部术语表改动</li><li>输出新的译文本与中英对照本</li></ul>'):'')
        +'<div class="opt-meta"><span>预计 40 秒</span><span>变更 12 段</span><span>产物 '+nextV+'</span></div></div>'
      +'<div class="opt'+((first||S.cmode==='scratch')?' is-sel':'')+'" data-act="cmode" data-id="scratch" data-od-id="compile-option-scratch">'

        +'<p class="opt-d">'+(first?('解析 PDF 结构后重新生成整份译文（'+TOTAL+' 段），再从零排版。这是首次编译，会调用翻译模型。'):('丢弃现有译文，重新生成整份译文（'+TOTAL+' 段全部重新翻译），然后从零排版。这不是重试，而是一次全新的编译。'))+'</p>'
        +(first?'':('<div class="warnbox"><b>请注意：</b>该方式会<b>再次调用翻译模型</b>，并<b>覆盖 '+v+' 中的 5 处人工修改</b>。原有内容仍保留在归档中，可随时恢复。</div>'
          +'<label class="ack" data-act="noop"><input type="checkbox" id="ack"'+((S.cmode==='scratch'&&S.ack)?' checked':'')+'>'
          +'<span>我已了解：从头重新编译会重新生成整份译文并覆盖人工修改</span></label>'))
        +'<div class="opt-meta"><span>预计 '+(first?'1 分 10 秒':'6 分 20 秒')+'</span><span>重新翻译 '+TOTAL+' 段</span><span>产物 '+nextV+'</span></div></div>'
      +'<div class="dr-sec">本次编译会包含</div>'
      +'<div class="diffbar"><span class="sw" style="background:var(--accent-soft);border:1px solid var(--accent-line)"></span><span>译文与术语表改动</span>'
      +'<span class="sw" style="background:var(--surface-3);border:1px solid var(--border)"></span><span>页眉页脚与编号</span>'

  d.querySelectorAll('input[type=radio]').forEach(r=>{r.addEventListener('change',e=>{S.cmode=e.target.value;S.ack=false;openDrawer();});});
  const ack=$('#ack');if(ack)ack.addEventListener('change',e=>{S.ack=e.target.checked;syncDrawerFoot();});
  syncDrawerFoot();
  requestAnimationFrame(()=>{d.classList.add('on');$('#scrim').classList.add('on');});

function syncDrawerFoot(){
  const b=$('#btn-start-compile');if(!b)return;

/* ============================================================
   N. 运行模拟（增量编译 / 只重新编译 / 重新翻译）
   ============================================================ */
function toast(title,sub,kind,actLabel,actId){
  const el=$('#toast');
  el.innerHTML='<span class="ic-wrap">'+ic(kind==='warn'?'alert':'check',16)+'</span>'
    +'<span><span class="tx">'+title+'</span>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</span>'
    +(actLabel?('<button class="lnk" data-act="'+(actId||'noop')+'" style="margin-left:6px">'+actLabel+'</button>'):'');
  el.querySelector('.ic-wrap .ic').classList.toggle('warn',kind==='warn');
  el.classList.add('on');
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),5200);
}
function runTask(kind,mode){
  const t=T();if(!t||S.run)return;
  const isCompile=(kind==='compile'||kind==='recompile');
  const onlyRe=kind==='recompile';
  t.status='running';t.progress=0.06;t.kind=kind;
  const first=t.phases[0],second=t.phases[1];
  const firstCompile=!t.versions.length;
  /* 是否调用翻译模型：只有「重新翻译」与「从头编译」会调用，「只重新编译」永远不调用 */
  const callsModel=onlyRe?false:(kind==='retranslate'?true:((mode==='scratch')||firstCompile));
  const runLabel=kind==='retranslate'?'重新翻译 · 会调用翻译模型'
    :(onlyRe?'仅重新排版 · 不调用翻译模型':(callsModel?'从头重新编译 · 会调用翻译模型':'增量修复 · 不调用翻译模型'));
  if(isCompile){
    const seq=String(t.phases.reduce((a,p)=>a+p.nodes.length,0)+1).padStart(2,'0');
    const txt=onlyRe
      ? (firstCompile?('按当前译文生成第一个归档版本（'+TOTAL+' 段）'):'按现有译文重新排版并生成新版本')
      : (firstCompile?('生成第一个归档版本（'+TOTAL+' 段译文）'):(mode==='incr'?'按增量模式重新编译受影响的 12 个段落':'从头重新编译整份译文（'+TOTAL+' 段）'));
    const modeLabel=onlyRe?(firstCompile?'仅重新编译（首次）':'仅重新编译'):(firstCompile?'首次编译':(mode==='incr'?'增量修复':'从头开始'));
    second.nodes.push(ev(seq,'编译',txt,'now','running',
      [['模式',modeLabel],['调用模型',callsModel?'是':'否'],['开始时间','刚刚']]));
    S.open[seq]=true;
  }else{
    const seq=String(t.phases.reduce((a,p)=>a+p.nodes.length,0)+1).padStart(2,'0');
    first.nodes.push(ev(seq,'翻译','重新翻译失败段落并回译校验','now','running',[['模型','deepseek-v3'],['范围','第 09 段与相邻 2 段']]));
    S.open[seq]=true;
  }
  S.run={kind:kind,mode:mode,onlyRe:onlyRe,callsModel:callsModel,label:runLabel,
    t0:Date.now(),dur:isCompile?(callsModel?7000:3600):5200};
  renderAll();
  S.run.timer=setInterval(()=>{
    const r=S.run;const p=Math.min(1,(Date.now()-r.t0)/r.dur);
    t.progress=0.06+p*0.94;t.pagesDone=Math.round(24*(t.progress||0));
    if(isCompile){const n=second.nodes[second.nodes.length-1];n.rel='+'+(1+p*1.2).toFixed(1)+'s';}
    renderToolbar();renderActions();renderInspector();
    if(p>=1)finishRun();
  },220);
}
function finishRun(){
  const r=S.run;clearInterval(r.timer);S.run=null;
  const t=T(),d=D();const isCompile=(r.kind==='compile'||r.kind==='recompile');
  const first=t.phases[0],second=t.phases[1];
  if(isCompile){
    const firstCompile=!t.versions.length;
    const callsModel=!!r.callsModel;
    const modeLabel=(r.onlyRe&&!firstCompile)?'仅重新编译（不调用翻译模型）':(firstCompile?'从头编译（首次）':(callsModel?'从头编译':'增量修复（基于 '+t.versions[0].v+'）'));
    const n=second.nodes[second.nodes.length-1];n.state='done';
    n.rel='+'+(callsModel?'6m20s':(firstCompile?'1m04s':'38s'));
    n.detail=[['耗时',callsModel?'06:12':(firstCompile?'01:04':'00:26')],['模式',modeLabel],['调用模型',callsModel?'是':'否'],['产物','output/zh/'+d.name.replace('.pdf','')+'-v'+(t.versions.length+1)+'.pdf']];
    const seq=String(t.phases.reduce((a,p)=>a+p.nodes.length,0)+1).padStart(2,'0');
    second.nodes.push(ev(seq,'预览','排版溢出检查通过，0 处越界','+'+(callsModel?'6m24s':(firstCompile?'1m08s':'30s')),'done',[['耗时','00:04'],['检查','段落溢出 · 图片越界 · 表格跨页']]));
    const nv={v:'v'+(t.versions.length+1),cur:true,at:'刚刚',mode:modeLabel,
      changed:callsModel?TOTAL:12,kept:callsModel?0:5,
      zh:'4.3 MB',dual:'8.1 MB',pages:d.pages};
    t.versions=t.versions.map(v=>{v.cur=false;return v;});
    t.versions.unshift(nv);
    t.status='success';t.ver=nv.v;t.verAt='刚刚';t.ranAt='刚刚';t.progress=0;
    S.insp='archive';
    toast('编译完成 · '+nv.v,'译文本 4.3 MB · 对照本 8.1 MB · '+(callsModel?('重新翻译了 '+TOTAL+' 段'):'复用现有译文，仅重新排版'),'ok','查看归档','pick-insp-archive');
  }else{
    const n=first.nodes[first.nodes.length-1];n.state='done';n.rel='+4.8s';
    n.detail=[['耗时','00:04'],['模型','deepseek-v3'],['结果','符号序列已匹配，回译一致'],['变更','第 09 段译文已更新']];
    n.txt='重新翻译完成：第 09 段符号序列已匹配';
    if(t.para&&t.para['P09']==='failed')t.para['P09']='done';
    t.status=t.versions.length?'success':'draft';t.ranAt='刚刚';t.progress=0;
    toast('翻译完成 · 1 处失败段落已修复','第 09 段已通过回译校验；可继续编译生成新版本','ok');
  }
  renderAll();
}

/* ============================================================
   O. 事件绑定
   ============================================================ */
function renderAll(){renderNav();renderTaskSwitch();renderToolbar();renderCanvas();renderInspector();renderActions();renderPop();save();}
document.addEventListener('click',e=>{
  if(S.pop&&!e.target.closest('#taskPop')&&!e.target.closest('[data-act="task-menu"]')){S.pop=false;renderPop();}
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(act==='noop')return;
  switch(act){
    case 'pick-doc':{const doc=docById(id);S.doc=id;S.task=S.taskByDoc[id]||doc.tasks[0]||null;S.page=Math.max(1,Math.min(S.pageByDoc[id]||1,doc.pages));S.para=null;S.insp='paras';S.pop=false;renderAll();break;}
    case 'pick-task':S.task=id;S.para=null;S.pop=false;renderAll();break;
    case 'new-task':{const x=NEW_TASKS[id];if(!x)break;
      const d=D(),nid='t'+(Date.now().toString(36));
      TASKS[nid]={name:x.name,kind:id,status:'empty',scope:'待开始',desc:x.desc,ver:null,verAt:'—',ranAt:'—',para:{},filter:'all',
        phases:[{name:'翻译与检查',nodes:[]},{name:'编译与预览',nodes:[]}],versions:[]};
      d.tasks.push(nid);S.task=nid;S.para=null;S.page=1;S.insp='paras';S.pop=false;
      renderAll();toast('已创建任务 · '+x.name,x.desc,'ok');break;}
    case 'pick-insp':S.insp=id;renderInspector();save();break;
    case 'pick-insp-archive':S.insp='archive';renderInspector();break;
    case 'pick-para':focusPara(id);break;
    case 'view':{const b=el;if(b.getAttribute('aria-disabled')==='true')return;S.view=id;renderToolbar();renderCanvas();save();break;}
    case 'page-prev':S.page=Math.max(1,S.page-1);renderToolbar();renderCanvas();save();break;
    case 'page-next':S.page=Math.min(D().pages,S.page+1);renderToolbar();renderCanvas();save();break;
    case 'zoom-in':S.z=Math.min(1.4,+(S.z+0.1).toFixed(2));renderToolbar();renderCanvas();save();break;
    case 'zoom-out':S.z=Math.max(0.6,+(S.z-0.1).toFixed(2));renderToolbar();renderCanvas();save();break;
    case 'zoom-fit':{const w=$('#canvas').clientWidth-52;S.z=Math.max(0.6,Math.min(1.2,+(w/720).toFixed(2)));renderToolbar();renderCanvas();save();break;}
    case 'toggle-event':S.open[id]=!S.open[id];renderInspector();break;
    case 'locate':{const t=T();const n=t.phases.map(p=>p.nodes).reduce((a,b)=>a.concat(b),[]).filter(x=>x.seq===id)[0];
      if(n&&n.state==='failed')focusPara(t.error.para);else S.page=Math.min(D().pages,S.page);renderToolbar();renderCanvas();break;}
    case 'copy-log':toast('节点日志已复制','已复制第 '+id+' 号节点的完整日志（本地示例不会写入剪贴板）','ok');break;
    case 'compile':openDrawer();break;
    case 'cmode':{const inp=el.querySelector('input');if(inp&&inp.disabled)return;S.cmode=id;S.ack=false;openDrawer();break;}
    case 'close-drawer':closeDrawer();break;
    case 'start-compile':{if(el.getAttribute('aria-disabled')==='true')return;const m=S.cmode;closeDrawer();setTimeout(()=>runTask('compile',m),240);break;}
    case 'recompile':if(el.getAttribute('aria-disabled')==='true')return;runTask('recompile','incr');break;
    case 'retranslate':if(el.getAttribute('aria-disabled')==='true')return;runTask('retranslate');break;
    case 'start-translate':{const d=D();if(!d.tasks.length){TASKS.tn={name:'全文翻译',status:'success',scope:'全文 '+TOTAL+' 段',ver:null,verAt:'—',ranAt:'刚刚',para:{},filter:'page',phases:[{name:'翻译与检查',nodes:[]},{name:'编译与预览',nodes:[]}],versions:[]};d.tasks=['tn'];S.task='tn';}
      S.doc=d.id;S.page=1;runTask('retranslate');break;}
    case 'cancel':{if(S.run){clearInterval(S.run.timer);S.run=null;}const t=T();t.status='failed';t.error={title:'翻译已取消',detail:'第 10 页之后的段落未翻译，可稍后重新翻译或只重新编译已完成部分。',advice:'',para:'P08'};t.progress=0;renderAll();toast('已取消翻译','已完成页面的译文保留在本次运行中','warn');break;}
    case 'restore':{toast('已恢复历史版本','译文与排版已回滚，归档文件未被删除','ok');break;}
    case 'download':toast('开始下载译文本','output/zh/'+D().name.replace('.pdf','')+'.zh.pdf','ok');break;
    case 'compare':toast('正在生成对比视图','逐段展示 v1 与当前版本的差异','ok');break;
    case 'open-settings':toast('任务配置','页码范围、术语表与符号映射可在任务配置中调整','ok');break;
    case 'task-menu':S.pop=!S.pop;renderPop();break;
    case 'new-project':toast('新建项目','项目用于归档同一课题下的文档与术语表','ok');break;
    case 'upload':toast('上传论文','支持单栏 / 双栏论文 PDF，单文件 ≤ 200 MB，自动识别 15 页以内为快速通道','ok');break;
    case 'workspace':toast('切换工作区','当前为单机模式工作区：语义通信实验室','ok');break;
    case 'toggle-nav':S.navOpen=!S.navOpen;if(S.navOpen)S.inspOpen=false;$('#nav').classList.toggle('open',S.navOpen);$('#insp').classList.remove('open');syncScrim();break;
    case 'toggle-insp':S.inspOpen=!S.inspOpen;if(S.inspOpen)S.navOpen=false;$('#insp').classList.toggle('open',S.inspOpen);$('#nav').classList.remove('open');syncScrim();break;
    case 'close-overlays':closeDrawer();S.navOpen=false;S.inspOpen=false;$('#nav').classList.remove('open');$('#insp').classList.remove('open');syncScrim();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDrawer();if(S.pop){S.pop=false;renderPop();}S.navOpen=false;S.inspOpen=false;$('#nav').classList.remove('open');$('#insp').classList.remove('open');syncScrim();}
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#navSearch').focus();}
});
window.addEventListener('resize',applyViewport);
// 评审用：只改 hash 时也重新应用状态预设（否则浏览器不会重新加载文档）
window.addEventListener('hashchange',()=>{
  if(!applyPreset())return;
  renderAll();
  if(S.openDrawer)setTimeout(openDrawer,120);
  else if(!$('#drawer').hidden||$('#drawer').classList.contains('on'))closeDrawer();
});
setupGutters();
applyViewport();
renderAll();
if(S.openDrawer){S.openDrawer=false;setTimeout(openDrawer,120);}
</script>
