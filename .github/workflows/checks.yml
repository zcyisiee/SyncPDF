name: Checks

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    name: Package, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache BabelDOC assets
        uses: actions/cache@v5
        with:
          path: ~/.cache/babeldoc
          key: babeldoc-assets-${{ hashFiles('babeldoc/assets/embedding_assets_metadata.py') }}

      - name: Setup uv with Python 3.12
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          activate-environment: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Build package
        run: uv build

      - name: Single entry smoke
        run: |
          uv run python -m compileall babeldoc babeldoc_tools experiments
          uv run bdt --help

      - name: Tests
        run: uv run python -m pytest tests/ -q
