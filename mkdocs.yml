# 项目信息与知识库导航
site_name: ieeTranslater
site_description: PDF 翻译、局部修订与在线部署的项目文档
repo_name: zcyisiee/ieeTranslater
repo_url: https://github.com/zcyisiee/ieeTranslater
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.top
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

validation:
  links:
    anchors: warn
    unrecognized_links: warn

nav:
  - 文档导航: index.md
  - 运行与验证: guide/cli.md
  - 子代理委派规范: guide/delegation.md
  - 管线与数据: reference/pipeline.md
  - HTTP 与工作台: reference/http-api.md
  - 在线部署设计: design/online-translation.md
